document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a92e7350-e3ad-4687-983f-98677497aab4\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;height:100%}\n::-webkit-scrollbar{width:8px;height:8px}\n::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}\n::-webkit-scrollbar-thumb:hover{background:#0f1011}\n::-webkit-scrollbar-track{background:transparent}\n.scrollthin{scrollbar-width:thin;scrollbar-color:#1a1b1e transparent}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex; height:100vh; width:100vw; overflow:hidden; background:#313338; color:#dbdee1; font-family:ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-size:14px; -webkit-font-smoothing:antialiased\">\n\n  <!-- SERVER RAIL -->\n  <nav style=\"width:72px; flex:none; background:#1e1f22; display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:8px; overflow-y:auto\" class=\"scrollthin\">\n    <div onclick=\"{{ showFriends }}\" style=\"width:48px; height:48px; flex:none; border-radius:16px; background:#5865f2; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff\" style-hover=\"border-radius:14px; background:#4752c4\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 5.5C4 4.7 4.7 4 5.5 4h13c.8 0 1.5.7 1.5 1.5V15c0 .8-.7 1.5-1.5 1.5H10l-4 3.5V16.5H5.5C4.7 16.5 4 15.8 4 15V5.5Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"width:32px; height:2px; flex:none; background:#2d2f32; border-radius:1px; margin:2px 0\"><\u002Fdiv>\n    <sc-for list=\"{{ servers }}\" as=\"srv\" hint-placeholder-count=\"6\">\n      <div style=\"position:relative; width:48px; height:48px; flex:none; cursor:pointer\">\n        <div style=\"width:48px; height:48px; border-radius:16px; background:{{ srv.color }}; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; letter-spacing:.3px\" style-hover=\"border-radius:14px\">{{ srv.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"width:48px; height:48px; flex:none; border-radius:24px; background:#2b2d31; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#23a55a; margin-top:2px\" style-hover=\"border-radius:16px; background:#23a55a; color:#fff\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- DM / FRIENDS SIDEBAR -->\n  <aside style=\"width:240px; flex:none; background:#2b2d31; display:flex; flex-direction:column\">\n    <div style=\"height:48px; flex:none; padding:8px 10px; box-shadow:0 1px 0 rgba(0,0,0,.2)\">\n      <button style=\"width:100%; height:30px; border:none; background:#1e1f22; border-radius:6px; color:#949ba4; font-size:13px; text-align:left; padding:0 8px; cursor:pointer; font-family:inherit\" style-hover=\"background:#1a1b1e\">Find or start a conversation<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1; overflow-y:auto; padding:8px\" class=\"scrollthin\">\n      <!-- top nav -->\n      <div onclick=\"{{ showFriends }}\" style=\"{{ navFriendsStyle }}\" style-hover=\"background:rgba(255,255,255,.04)\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><path d=\"M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7Zm6 0a3 3 0 100-6 3 3 0 000 6Zm-6 1.5c-3 0-6 1.5-6 4V19h9v-1.5c0-1 .4-2 1.1-2.7C12.4 13.2 10.8 12.5 9 12.5Zm6 .5c-.5 0-1 .05-1.5.15 1 .8 1.5 1.85 1.5 3.35V19h6v-2c0-2.5-3-4-6-4Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n        <span>Friends<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; padding:8px; border-radius: e=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:flex; gap:14px; color:#b5bac1\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"cursor:pointer\" style-hover=\"color:#dbdee1\"><path d=\"M5 6c0-1 1-2 2-2h2l2 4-2 1.5c.8 1.8 2.7 3.7 4.5 4.5L16 12l4 2v2c0 1-1 2-2 2-7 0-13-6-13-13Z\" stroke=\"currentColor\" stroke-width=\"1.6\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"cursor:pointer\" style-hover=\"color:#dbdee1\"><rect x=\"3\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Frect><path d=\"M15 10l6-3v10l-6-3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"cursor:pointer\" style-hover=\"color:#dbdee1\"><path d=\"M16 3l1 4 4 1-4 1-1 4-1-4-4-1 4-1 1-4ZM7 12l.6 2.4L10 15l-2.4.6L7 18l-.6-2.4L4 15l2.4-.6L7 12Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div ref=\"{{ scrollRef }}\" style=\"flex:1; overflow-y:auto; padding:16px 16px 0\" class=\"scrollthin\">\n      <!-- intro -->\n      <div style=\"padding:16px 0 8px\">\n        <div style=\"width:64px; height:64px; border-radius:50%; background:{{ activeDm.avColor }}; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:26px; margin-bottom:8px\">{{ activeDm.initial }}<\u002Fdiv>\n        <div style=\"font-size:28px; font-weight:800; color:#f2f3f5\">{{ activeDm.name }}<\u002Fdiv>\n        <div style=\"font-size:14px; color:#b5bac1; margin-top:4px\">This is the beginning of your direct message history with <b style=\"color:#f2f3f5\">{{ activeDm.name }}<\u002Fb>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:#3f4147; margin:16px 0\"><\u002Fdiv>\n\n      <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex; gap:14px; padding:4px 0 6px\" style-hover=\"background:rgba(0,0,0,.06)\">\n          <div style=\"width:40px; height:40px; flex:none; border-radius:50%; background:{{ m.color }}; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:15px\">{{ m.initial }}<\u002Fdiv>\n          <div style=\"flex:1; min-width:0\">\n            <div style=\"display:flex; align-items:baseline; gap:8px\">\n              <span style=\"font-weight:600; color:#f2f3f5; font-size:15px\">{{ m.author }}<\u002Fspan>\n              <span style=\"font-size:11px; color:#949ba4\">{{ m.time }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ m.lines }}\" as=\"line\" hint-placeholder-count=\"1\">\n              <div style=\"color:#dbdee1; font-size:15px; line-height:1.4; margin-top:2px\">{{ line }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"height:16px\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:none; padding:0 16px 24px\">\n      <div style=\"display:flex; align-items:center; gap:12px; background:#383a40; border-radius:8px; padding:0 16px\">\n        <button style=\"width:24px; height:24px; border:none; background:#b5bac1; color:#383a40; border-radius:50%; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center\" style-hover=\"background:#dbdee1\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <input ref=\"{{ inputRef }}\" onkeydown=\"{{ onInputKey }}\" placeholder=\"{{ inputPlaceholder }}\" style=\"flex:1; height:44px; border:none; background:transparent; color:#dbdee1; font-size:15px; outline:none; font-family:inherit\">\n        <div style=\"display:flex; gap:14px; color:#b5bac1; flex:none\">\n          <svg onclick=\"{{ send }}\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"cursor:pointer\" style-hover=\"color:#dbdee1\"><path d=\"M4 5l16 7-16 7 3-7-3-7Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"cursor:pointer\" style-hover=\"color:#dbdee1\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Fcircle><path d=\"M9 10h.01M15 10h.01M8.5 14c1 1.2 5 1.2 6 0\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  inputRef = React.createRef();\n  scrollRef = React.createRef();\n\n  state = { view: 'friends', tab: 'online', search: '', activeDmId: null, bannerOpen: true, threads: {} };\n\n  palette = ['#5865f2','#23a55a','#eb459e','#3ba55d','#faa61a','#ed4245','#9b59b6','#1abc9c','#e67e22','#5b6eae','#d4528a','#00a8fc'];\n  statusColors = { online:'#23a55a', idle:'#f0b232', dnd:'#f23f43', offline:'#80848e' };\n\n  serverData = [\n    { label:'GM', color:'#5865f2' },\n    { label:'PX', color:'#e67e22' },\n    { label:'SK', color:'#3ba55d' },\n    { label:'AR', color:'#9b59b6' },\n    { label:'BM', color:'#1e1f22' },\n    { label:'TS', color:'#d4528a' },\n  ];\n\n  friendData = [\n    { name:'Avery',   status:'dnd',     sub:'Do Not Disturb',        tag:'MOD' },\n    { name:'Blake',   status:'idle',    sub:'Idle' },\n    { name:'Casey',   status:'online',  sub:'Online' },\n    { name:'Dana',    status:'dnd',     sub:'Do Not Disturb' },\n    { name:'Eli',     status:'online',  sub:'Online',                tag:'ART' },\n    { name:'Frankie', status:'online',  sub:'In voice — Lounge' },\n    { name:'Harper',  status:'online',  sub:'In voice — Lounge' },\n    { name:'Indie',   status:'online',  sub:'Sharing their screen' },\n    { name:'Jordan',  status:'online',  sub:'Playing Skyline Drift' },\n    { name:'Kai',     status:'idle',    sub:'Idle' },\n    { name:'Lane',    status:'online',  sub:'Online' },\n    { name:'Morgan',  status:'offline', sub:'Offline' },\n    { name:'Nico',    status:'offline', sub:'Offline' },\n    { name:'Quinn',   status:'offline', sub:'Offline' },\n  ];\n\n  colorFor(name) {\n    let h = 0;\n    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;\n    return this.palette[h % this.palette.length];\n  }\n\n  decorate(f) {\n    return {\n      ...f,\n      initial: f.name[0].toUpperCase(),\n      avColor: this.colorFor(f.name),\n      statusColor: this.statusColors[f.status] || '#80848e',\n      online: f.status !== 'offline',\n    };\n  }\n\n  seedThread(f) {\n    const c = this.colorFor(f.name);\n    const init = f.name[0].toUpperCase();\n    return [\n      { id: 1, author: f.name, color: c, initial: init, time: 'Today at 2:14 PM', lines: ['hey! you around?'] },\n      { id: 2, author: 'you', color: '#3ba55d', initial: 'Y', time: 'Today at 2:15 PM', lines: ['yeah whats up'] },\n      { id: 3, author: f.name, color: c, initial: init, time: 'Today at 2:16 PM', lines: ['wanna hop in voice in a bit?', 'testing the new build'] },\n    ];\n  }\n\n  showFriends = () => this.setState({ view: 'friends' });\n  tabOnline = () => this.setState({ tab: 'online' });\n  tabAll = () => this.setState({ tab: 'all' });\n  closeBanner = () => this.setState({ bannerOpen: false });\n  setSearch = (e) => this.setState({ search: e.target.value });\n\n  openDm = (name) => {\n    this.setState((s) => {\n      const threads = { ...s.threads };\n      if (!threads[name]) {\n        const f = this.friendData.find((x) => x.name === name);\n        threads[name] = this.seedThread(f);\n      }\n      return { view: 'dm', activeDmId: name, threads };\n    }, () => this.scrollDown());\n  };\n\n  scrollDown() {\n    const el = this.scrollRef.current;\n    if (el) el.scrollTop = el.scrollHeight;\n  }\n\n  send = () => {\n    const el = this.inputRef.current;\n    if (!el) return;\n    const v = el.value.trim();\n    if (!v || !this.state.activeDmId) return;\n    el.value = '';\n    this.setState((s) => {\n      const threads = { ...s.threads };\n      const arr = (threads[s.activeDmId] || []).slice();\n      arr.push({ id: Date.now(), author: 'you', color: '#3ba55d', initial: 'Y', time: 'Today', lines: [v] });\n      threads[s.activeDmId] = arr;\n      return { threads };\n    }, () => this.scrollDown());\n  };\n\n  onInputKey = (e) => {\n    if (e.key === 'Enter' && !e.shiftKey) {\n      e.preventDefault();\n      this.send();\n    }\n  };\n\n  tabStyle(active) {\n    const base = 'height:28px; border:none; font-size:14px; font-weight:600; padding:0 8px; border-radius:6px; cursor:pointer; font-family:inherit;';\n    return active\n      ? base + ' background:#3f4248; color:#f2f3f5;'\n      : base + ' background:transparent; color:#b5bac1;';\n  }\n\n  renderVals() {\n    const s = this.state;\n    const list = this.friendData.map((f) => this.decorate(f));\n    const q = s.search.trim().toLowerCase();\n\n    let friends = list.filter((f) => (s.tab === 'all' ? true : f.online));\n    if (q) friends = friends.filter((f) => f.name.toLowerCase().includes(q));\n    friends = friends.map((f) => ({ ...f, open: () => this.openDm(f.name) }));\n\n    const onlineCount = list.filter((f) => f.online).length;\n    const isDm = s.view === 'dm' && s.activeDmId != null;\n\n    const dms = list.map((f) => {\n      const active = isDm && s.activeDmId === f.name;\n      return {\n        ...f,\n        open: () => this.openDm(f.name),\n        rowStyle: 'display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer; margin-bottom:1px;' + (active ? ' background:#3f4248;' : ''),\n        nameStyle: 'font-size:15px; ' + (active ? 'color:#f2f3f5; font-weight:500' : 'color:#949ba4'),\n      };\n    });\n\n    const activeDm = isDm ? this.decorate(this.friendData.find((x) => x.name === s.activeDmId)) : null;\n    const messages = isDm ? (s.threads[s.activeDmId] || []) : [];\n\n    return {\n      servers: this.serverData,\n      dms,\n      friends,\n      empty: friends.length === 0,\n      listLabel: s.tab === 'all' ? 'All Friends' : 'Online',\n      listCount: friends.length,\n      onlineCount,\n      isFriends: s.view === 'friends',\n      isDm,\n      activeDm,\n      messages,\n      search: s.search,\n      bannerOpen: s.bannerOpen,\n      inputPlaceholder: activeDm ? ('Message @' + activeDm.name) : 'Message',\n      navFriendsStyle: 'display:flex; align-items:center; gap:12px; padding:8px; border-radius:6px; cursor:pointer; margin-bottom:1px;' + (s.view === 'friends' ? ' background:#3f4248; color:#f2f3f5;' : ' color:#949ba4;'),\n      tabOnlineStyle: this.tabStyle(s.tab === 'online'),\n      tabAllStyle: this.tabStyle(s.tab === 'all'),\n      showFriends: this.showFriends,\n      tabOnline: this.tabOnline,\n      tabAll: this.tabAll,\n      closeBanner: this.closeBanner,\n      setSearch: this.setSearch,\n      send: this.send,\n      onInputKey: this.onInputKey,\n      inputRef: this.inputRef,\n      scrollRef: this.scrollRef,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
