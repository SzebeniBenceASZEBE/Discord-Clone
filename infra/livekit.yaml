# LiveKit SFU config. The API key/secret are NOT here — they come from the
# LIVEKIT_KEYS env var (set in docker-compose from .env), so there's a single
# source of truth shared with the backend.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
logging:
  level: info
