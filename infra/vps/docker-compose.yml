# VPS stack: LiveKit SFU + Caddy for TLS on the SFU domain. This is the only
# heavy-traffic component and the least-trusted box, which is why call media is
# E2EE (LiveKit insertable streams) end to end — the SFU relays but cannot read.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media UDP range must be reachable directly (not proxied through Caddy).
      - "50000-50100:50000-50100/udp"
    expose:
      - "7880"

volumes:
  caddy_data:
  caddy_config:
