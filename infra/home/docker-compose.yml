# Home server stack: Caddy (TLS + routing) -> web (static build) + server (Node).
# SQLite and encrypted file blobs persist on the host via the ./data volume.
#
# Dockerfiles for web/server are added when we containerize; for now this is the
# intended shape so the topology is reviewable.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  server:
    build:
      context: ../../
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/server/.env
    volumes:
      - ./data:/app/data
    expose:
      - "3001"

volumes:
  caddy_data:
  caddy_config:
